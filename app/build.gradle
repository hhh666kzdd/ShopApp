// app 模块构建文件
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shopapp'
    compileSdk 34
    // 显式指定本机已安装的 Build Tools，避免 AGP 尝试联网下载其它版本
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.example.shopapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // mysql-connector 等 jar 中的 META-INF 文件可能与其它库重复，这里统一排除
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    // 布局中直接写中文文案会触发 lint 警告，不让其中断打包
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Android 端 JDBC 直连 MySQL，必须使用 5.1.x（8.x 在 Android 上不兼容）
    implementation 'mysql:mysql-connector-java:5.1.49'
}
